; beamLED: standalone ceiling renderer on a WT32-ETH01
; First flash / recovery over USB serial: python -m platformio run -e wt32-eth01 -t upload
[env:wt32-eth01]
platform = espressif32
board = wt32-eth01
framework = arduino
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5
upload_speed = 460800
lib_deps =
    fastled/FastLED@^3.9.0
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1

; Firmware update over the network: python -m platformio run -e ota -t upload
; (or --upload-port <IP>)
[env:ota]
extends = env:wt32-eth01
upload_protocol = espota
upload_port = beamled.local
